services:

  minio:
    image: minio/minio:latest
    container_name: oulad-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:16
    container_name: oulad-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dagster-webserver:
    build: .
    container_name: oulad-dagster-webserver
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/app/dagster_home/workspace.yaml"]
    ports:
      - "3000:3000"
    environment:
      DAGSTER_HOME: /app/dagster_home
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - postgres
      - minio

  dagster-daemon:
    build: .
    container_name: oulad-dagster-daemon
    command: ["dagster-daemon", "run", "-w", "/app/dagster_home/workspace.yaml"]
    environment:
      DAGSTER_HOME: /app/dagster_home
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - postgres
      - minio

  streamlit:
    build: .
    container_name: oulad-streamlit
    command: ["streamlit", "run", "dashboard/streamlit_app.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - postgres

volumes:
  minio_data:
  postgres_data: